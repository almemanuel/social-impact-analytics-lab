services:

  db:
    image: postgres:16-alpine
    container_name: postgres_social
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: dados_social
    ports:
      - "5433:5432"
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"

  api:
    build: .
    container_name: api_social
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
